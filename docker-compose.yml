services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  go-mod-cache:
  frontend-node-modules:
